<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- 시간표 짜기 — 격자 아홉 칸. 머리행(회색) + 몸통(연회색) + 배치된 칸 둘(파랑·주황). 16px 에서도 격자로 읽히게 선 없이 칸만. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e293b"/>
  <rect x="12" y="12" width="12" height="12" rx="3" fill="#94a3b8"/>
  <rect x="26" y="12" width="12" height="12" rx="3" fill="#94a3b8"/>
  <rect x="40" y="12" width="12" height="12" rx="3" fill="#94a3b8"/>
  <rect x="12" y="26" width="12" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="26" y="26" width="12" height="12" rx="3" fill="#3b82f6"/>
  <rect x="40" y="26" width="12" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="12" y="40" width="12" height="12" rx="3" fill="#f59e0b"/>
  <rect x="26" y="40" width="12" height="12" rx="3" fill="#e2e8f0"/>
  <rect x="40" y="40" width="12" height="12" rx="3" fill="#e2e8f0"/>
</svg>
