# 시연·검수용 NAS 배포. 바깥 노출은 cloudflared Quick Tunnel 하나뿐(NAS 포트 안 엶).
# 격리: 프로젝트 이름·볼륨·망을 따로 둬 NAS 의 다른 컨테이너와 안 섞인다. 자료는 검수용 가짜 학교만.
# 실행: cp env.example .env (값 채움) → docker load -i 이미지.tar → docker compose -f docker-compose.nas-demo.yml up -d
# 바뀐 주소: docker logs tt-demo-tunnel 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
name: tt-demo
services:
  db:
    image: postgres:16
    container_name: tt-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 가 필요}
      POSTGRES_DB: timetable
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [inner]
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable"]
      interval: 5s
      retries: 20
  app:
    image: school-timetable:__VER__
    container_name: tt-demo-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://timetable:${DB_PASSWORD}@db:5432/timetable
      SESSION_SECRET: ${SESSION_SECRET:?.env 에 SESSION_SECRET 이 필요}
      DATA_KEY: ${DATA_KEY:?.env 에 DATA_KEY 가 필요}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      PORT: "3000"
    networks: [inner]          # 바깥으로 나가는 길 없음 · 포트도 안 엶
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tt-demo-tunnel
    restart: unless-stopped
    depends_on: [app]
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:3000"]
    networks: [inner, egress]  # 터널만 바깥(Cloudflare)으로 나간다
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  inner:
    internal: true
  egress: {}
volumes:
  dbdata:
