<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 경로는 전부 상대(./) — GitHub Pages 가 /<repo>/ 아래에서 서빙하고, Electron 은 file:// 로 연다 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10151c" />
    <!-- iOS 홈 화면 앱: 주소창 없이 전체 화면, 상단 상태바는 어두운 바탕에 겹침 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="시간표" />
    <meta name="description" content="규칙을 데이터로 받는 초등 시간표 도구" />
    <title>시간표 짜기</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
