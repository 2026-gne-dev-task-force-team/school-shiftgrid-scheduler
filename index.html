<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 경로는 전부 상대(./) — GitHub Pages 가 /<repo>/ 아래에서 서빙하고, Electron 은 file:// 로 연다 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 테마 바탕에 맞춘 상단 바 색 — 시스템 밝기를 media 로 가른다(라이트=흰색, 다크=#191919) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <!-- 홈 화면 앱(standalone): 표준 키. ⛔ apple-mobile-web-app-capable 은 deprecated 라 뺐다(콘솔 경고 0) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="시간표 1.2v" />
    <meta name="description" content="규칙을 데이터로 받는 초등 시간표 도구" />
    <title>시간표 짜기 1.2v</title>
    <!-- 묵은 index 가 지워진 옛 진입 스크립트를 부르면 SW·캐시를 걷고 한 번만 새로고침(백지 방지) -->
    <script src="./stale-recover.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
