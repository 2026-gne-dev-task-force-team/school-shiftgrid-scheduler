# 의견 창구 중계 — Cloudflare Worker 설정. 배포는 .github/workflows/feedback-worker.yml 이 한다.
name = "shiftgrid-feedback"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# 이슈·캡처가 들어갈 저장소 ("조직/저장소"). ⭐ 비공개 저장소를 권한다 — 캡처에 교사 실명이 보일 수 있다
GITHUB_REPO = "2026-gne-dev-task-force-team/school-shiftgrid-feedback"
# 캡처를 커밋할 브랜치 (없으면 만든다)
ATTACH_BRANCH = "attachments"
# 앱이 사는 주소만 받는다 (쉼표로 여러 개). 로컬 개발도 넣어 둔다
ALLOWED_ORIGINS = "https://2026-gne-dev-task-force-team.github.io,http://localhost:5173,file://"

# GITHUB_TOKEN 은 여기 적지 않는다 — 비밀값이다. Actions 가 `wrangler secret put` 으로 넣는다.
