name: Supabase deploy
# B13 — supabase/** 가 바뀌면 마이그레이션(db push)과 함수 전부를 올린다.
# 시크릿 값은 쥔님이 레포 Settings 에서 넣는다. 비어 있으면 「건너뜀」으로 성공 종료한다.

on:
  push:
    branches: ['1.2v-preview', main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: 시크릿 확인
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "시크릿 없음 — 건너뜀"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      - name: 프로젝트 연결
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: 마이그레이션 올리기
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: 함수 전부 올리기
        if: steps.gate.outputs.ready == 'true'
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d")
            case "$n" in _*) continue ;; esac
            [ -f "$d/index.ts" ] || continue
            supabase functions deploy "$n" --project-ref "$SUPABASE_PROJECT_REF"
          done
