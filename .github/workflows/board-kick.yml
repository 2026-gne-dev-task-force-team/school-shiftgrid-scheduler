name: 현황판 배포 신호

# github-pages 배포 환경은 main 만 허락한다. 그래서 여기서는 배포하지 않고,
# main 의 deploy.yml 을 돌려 달라고 신호만 보낸다(그쪽이 1.2v-preview 의 board/ 를 같이 빌드한다).
# GITHUB_TOKEN 으로 보낸 workflow_dispatch 는 새 실행을 만든다(GitHub 이 허락한 예외).
on:
  push:
    branches: [1.2v-preview]

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
