name: Deploy to GitHub Pages

# 한 사이트에 두 판을 나란히 올린다.
#   루트   = v1 브랜치 (김은지 선생님이 쓰시는 판 · 동결 · 주소가 바뀌면 안 된다)
#   /v2/   = main 브랜치 (대개편 중)
# 어느 브랜치에 푸시하든 둘 다 다시 빌드해서 통째로 올린다 — 한쪽만 올리면 다른 쪽이 사라진다.
on:
  push:
    branches: [main, v1]
  workflow_dispatch: # 수동 실행 허용

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중이면 최신 것으로 대체)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── v1 (루트) ───────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - run: npm ci
        working-directory: v1
      - run: npm run build
        working-directory: v1
        env:
          # 의견 창구 공개 토큰(워크플로 실행 권한만). 비어 있으면 앱은 파일 내려받기 길로 돈다 → docs/의견 창구 인수인계.md
          VITE_FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_DISPATCH_TOKEN }}

      # ── v2 (/v2/) ──────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: main
          path: v2

      # v2 는 표 부품을 비공개 레포(gne-sheet)에서 git 의존성으로 받는다.
      # 기본 GITHUB_TOKEN 은 자기 레포 밖을 못 읽어서, 읽기 전용 토큰을 git 에 꽂아 준다.
      # ⭐ 토큰이 없으면 이 단계를 건너뛴다 — 아직 그 의존성을 안 넣었으면 아무 일도 안 일어난다.
      #    (토큰 만드는 법·만료 때 할 일은 볼트 「표 부품 라이브러리 설계」)
      - name: 비공개 부품 레포 읽기 권한
        env:
          GNE_SHEET_TOKEN: ${{ secrets.GNE_SHEET_TOKEN }}
        run: |
          # 🔴 값은 안 찍는다. 「있나 없나」만 길이로 센다 — 빈 토큰과 틀린 토큰은
          #    둘 다 Repository not found 로 똑같이 보여서, 이 줄이 없으면 안 갈린다.
          echo "토큰 길이: ${#GNE_SHEET_TOKEN}"
          if [ -z "$GNE_SHEET_TOKEN" ]; then
            echo "토큰이 비어 있다 — 인증을 안 꽂고 넘어간다"
            exit 0
          fi
          AUTH="https://x-access-token:${GNE_SHEET_TOKEN}@github.com/"
          # 🔴 세 가지 주소 모양을 전부 덮는다. package-lock.json 의 resolved 가
          #    git+ssh://git@github.com/… 로 박히는데(npm 이 그렇게 적는다) CI 엔 SSH 키가 없다.
          #    https 만 덮으면 그 ssh 주소에서 죽는다 — 2026-10-17 실측으로 걸렸다.
          # 🔴 --add 가 핵심이다. insteadOf 는 여러 값을 갖는 키라서, --add 없이 세 번 부르면
          #    앞의 것을 덮어쓰고 마지막 하나만 남는다(2026-10-17 실측 — ssh 가 안 덮여 죽었다).
          git config --global --add url."$AUTH".insteadOf "https://github.com/"
          git config --global --add url."$AUTH".insteadOf "ssh://git@github.com/"
          git config --global --add url."$AUTH".insteadOf "git@github.com:"
          echo "꽂힌 규칙 $(git config --global --get-all url."$AUTH".insteadOf | wc -l) 개 (3 이어야 한다)"
          git config --global --get-all url."$AUTH".insteadOf | sed 's/^/  · /'
          # 🔴 npm 에 맡기지 말고 여기서 먼저 인증을 재 본다. npm 의 에러는 「빈 토큰」과
          #    「권한 없음」을 똑같이 Repository not found 로 보여줘서 원인이 안 갈린다.
          echo "── 부품 레포에 실제로 닿나 ──"
          git ls-remote "https://github.com/2026-gne-dev-task-force-team/gne-sheet.git" HEAD

      - run: npm ci
        working-directory: v2
      - run: npm run build
        working-directory: v2
        env:
          VITE_FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_DISPATCH_TOKEN }}

      # ── 합치기 ─────────────────────────────────────────────────
      # v1 빌드를 루트에 깔고, 그 위에 v2 빌드를 /v2/ 로 넣는다.
      - name: 두 판을 한 폴더로
        run: |
          set -eu
          mkdir -p site
          cp -R v1/dist/. site/
          mkdir -p site/v2
          cp -R v2/dist/. site/v2/
          # 올라가는 게 맞는지 눈으로 확인할 수 있게 남긴다
          echo "── 루트(v1) ──"; ls site | head -20
          echo "── /v2/ ──";     ls site/v2 | head -20
          test -f site/index.html
          test -f site/v2/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 워크플로가 자동 활성화
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
