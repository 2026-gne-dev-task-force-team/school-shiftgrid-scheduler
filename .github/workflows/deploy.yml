name: Deploy to GitHub Pages

# 한 사이트에 두 판을 나란히 올린다.
#   루트   = v1 브랜치 (김은지 선생님이 쓰시는 판 · 동결 · 주소가 바뀌면 안 된다)
#   /v2/   = main 브랜치 (대개편 중)
#   /v1.2/ = 1.2v-preview 가지 (1.2v 앱 + 맨 위 현황판 막대)
#   /board/ = 현황판 독립 번들(1.2v-preview 의 board/) — v1·v2 페이지에 deploy/inject-board.mjs 가 주입
#   /preview/ = 옛 1.2v 주소 — deploy/redirect-preview/ 의 넘겨주기 페이지 + 스스로 해제하는 서비스워커
# 어느 브랜치에 푸시하든 셋 다 다시 빌드해서 통째로 올린다 — 한쪽만 올리면 다른 쪽이 사라진다.
# 배포 환경(github-pages)은 main 만 허락한다 — 1.2v-preview 는 board-kick.yml 이 이 워크플로를 main 으로 돌려 달라고 신호만 보낸다.
on:
  push:
    branches: [main, v1]
  workflow_dispatch: # 수동 실행 허용

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중이면 최신 것으로 대체)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── v1 (루트) ───────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - run: npm ci
        working-directory: v1
      - run: npm run build
        working-directory: v1
        env:
          # 의견 창구 공개 토큰(워크플로 실행 권한만). 비어 있으면 앱은 파일 내려받기 길로 돈다 → docs/의견 창구 인수인계.md
          VITE_FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_DISPATCH_TOKEN }}

      # ── v2 (/v2/) ──────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: main
          path: v2
          # 작업트리에 인증 헤더를 남기지 않는다(빌드 단계가 토큰을 쓸 일이 없다).
          persist-credentials: false

      - run: npm ci
        working-directory: v2
      - run: npm run build
        working-directory: v2
        env:
          VITE_FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_DISPATCH_TOKEN }}

      # ── 1.2v (/v1.2/) — 맨 위 막대가 현황판 서랍이다 ─────
      # 저장소 이름표는 그 가지에서 shiftgrid.v1_2 로 갈라 /v2/ 와 안 섞인다.
      # tsc -b 는 로컬 검사로 갈음 — 여기서 깨지면 v1·v2 배포까지 막힌다.
      - uses: actions/checkout@v4
        with:
          ref: 1.2v-preview
          path: preview
          persist-credentials: false
      - run: npm ci
        working-directory: preview
      - run: npx vite build
        working-directory: preview
        env:
          # 현황판이 board 표를 읽는 공개(anon) 키 — 비어 있으면 막대는 목업으로 돈다
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co', vars.SUPABASE_PROJECT_REF) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # 현황판 독립 번들 한 벌(board/vite.config.ts · base './') — v1·v2 페이지에 주입한다. 같은 공개 키.
      - run: npx vite build --config board/vite.config.ts
        working-directory: preview
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co', vars.SUPABASE_PROJECT_REF) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ── 합치기 ─────────────────────────────────────────────────
      # v1 빌드를 루트에 깔고, 그 위에 v2 빌드를 /v2/ 로 넣는다.
      - name: 두 판을 한 폴더로
        run: |
          set -eu
          mkdir -p site
          cp -R v1/dist/. site/
          mkdir -p site/v2
          cp -R v2/dist/. site/v2/
          mkdir -p site/v1.2
          cp -R preview/dist/. site/v1.2/
          test -f site/v1.2/index.html
          # 옛 주소 /preview/ 는 새 주소 /v1.2/ 로 넘긴다. 옛 서비스워커가 남은 기기를 위해
          # sw.js 는 스스로 해제하는 판으로 덮는다(1.2v 빌드의 sw.js 가 아니다) — 이게 없으면 옛 1.2v 사본이 계속 뜬다.
          mkdir -p site/preview
          cp -R v2/deploy/redirect-preview/. site/preview/
          test -f site/preview/index.html
          test -f site/preview/sw.js
          test -f site/preview/board/index.html
          # 올라가는 게 맞는지 눈으로 확인할 수 있게 남긴다
          echo "── 루트(v1) ──"; ls site | head -20
          echo "── /v2/ ──";     ls site/v2 | head -20
          test -f site/index.html
          test -f site/v2/index.html

      # ── 현황판 주입 (v1·v2 에도 각자 막대) ─────────────────────
      - name: 현황판을 v1·v2 에 주입
        run: |
          set -eu
          mkdir -p site/board
          cp -R preview/board/dist/. site/board/
          test -f site/board/index.html
          node v2/deploy/inject-board.mjs site
          # 주입 결과 검사 — 파일·태그·판 이름표가 빌드 트리에 있어야 한다
          JS=$(grep -o 'assets/[^"]*\.js' site/board/index.html | head -1)
          test -f "site/board/$JS"
          grep -q 'data-app="v1"' site/index.html
          grep -q "src=\"./board/$JS\"" site/index.html
          grep -q 'data-app="v2"' site/v2/index.html
          grep -q "src=\"../board/$JS\"" site/v2/index.html
          grep -q 'data-board-injected' site/index.html
          grep -q 'data-board-injected' site/v2/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 워크플로가 자동 활성화
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
