# 개발·시험용(맥북). 교육청 컨테이너에서는 DATABASE_URL·SESSION_SECRET 을 파일(_FILE)로 준다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: timetable-dev
      POSTGRES_DB: timetable
    ports: ["127.0.0.1:55432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://timetable:timetable-dev@db:5432/timetable
      SESSION_SECRET: dev-only-change-me
      COOKIE_SECURE: "false"   # 개발은 http. 운영은 HTTPS 라 기본(true)
      PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
volumes:
  dbdata:
